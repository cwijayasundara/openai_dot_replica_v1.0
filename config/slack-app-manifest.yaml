# Create the app at https://api.slack.com/apps -> "Create New App" -> "From an app manifest".
# Socket Mode needs no public URL; for the Events API on GCP, turn Socket Mode off
# and set the request URLs to https://<api host>/slack/events.
display_information:
  name: open dot
  description: An always-on research dot.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: dot
    always_online: true
  shortcuts:
    - name: Correct this
      type: message
      callback_id: dot_correct
      description: Tell the dot what to do differently next time
oauth_config:
  scopes:
    bot:
      - app_mentions:read   # mentions in channels bound to a dot
      - chat:write          # replies, approval cards and their updates
      - commands            # the "Correct this" message shortcut
      - im:history          # DMs to the bot (message.im)
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
