[project]
name = "open-dot"
version = "0.1.0"
description = "Open, self-hostable always-on agent runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.7.20",
    "langchain~=1.4",
    "langgraph~=1.2",
    "langchain-fireworks~=1.7",
    "langchain-openai~=1.6",
    "langchain-mcp-adapters~=0.3",
    "langgraph-checkpoint-postgres~=3.1",
    "psycopg[binary,pool]~=3.3",
    # langchain-fireworks 1.7 pulls fireworks-ai, which rejects pydantic 2.13.
    "pydantic>=2.12,<2.13",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
    "slack-bolt~=1.30",
    "apscheduler~=3.11",
    "docker>=7.1",
    "openshell~=0.1",
    "opentelemetry-sdk>=1.30",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "google-cloud-secret-manager>=2.20,<3",
    "google-crc32c>=1.5,<2",
]

[project.scripts]
dot = "dot.surfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.15",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dot"]

[tool.hatch.build.targets.wheel.force-include]
"sandbox/policies" = "dot/sandbox/policies"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--strict-markers -m 'not live and not docker and not db and not openshell and not gcp'"
asyncio_mode = "auto"
markers = [
    "live: needs DOT_FIREWORKS_API_KEY and calls a real model",
    "docker: needs a running Docker daemon and the dot-sandbox image",
    "db: needs Postgres from docker compose (DOT_DATABASE_URL)",
    "openshell: needs a running OpenShell gateway",
    "gcp: needs application-default credentials and DOT_GCP_TEST_PROJECT; creates and deletes a test secret",
]
